name: Monorepo CI

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
  pull_request:
    branches: [main]
    paths:
      - 'services/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: set-matrix
        run: |
          # TODO: Use git diff to detect changed directories under services/
          # TODO: Convert the directory list into JSON
          # TODO: Set outputs: matrix and has_changes
           CHANGED=$(git diff --name-only HEAD~1 HEAD | grep '^services/' | cut -d'/' -f2 | sort -u)
            if [ -z "$CHANGED" ]; then
              echo "has_changes=false" >> $GITHUB_OUTPUT
              echo "matrix={\"service\":[]}" >> $GITHUB_OUTPUT
            else
              JSON=$(echo "$CHANGED" | jq -R -s -c 'split("\n") | map(select(. != ""))')
              echo "has_changes=true" >> $GITHUB_OUTPUT
              echo "matrix={\"service\":$JSON}" >> $GITHUB_OUTPUT    #⬅️ format required by fromJson
            fi
            
          echo "has_changes=false" >> $GITHUB_OUTPUT
          echo "matrix={\"service\":[]}" >> $GITHUB_OUTPUT

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    # TODO: Add a condition that checks has_changes
    runs-on: ubuntu-latest
    strategy:
      # TODO: Use fromJson() with the detect-changes output as the matrix
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }} 
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Build service
        run: |
          # TODO: Build the service from the matrix
          echo "Building service: ${{ matrix.service }}"
          cd services/${{ matrix.service }}
          npm install
          npm run build

  aggregate:
    # TODO: Implement the build-result aggregation job
    # - depends on build
    # - runs even if build failed (if: always())
    # - checks the result and reports an error if any build failed
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.build.result }}" == "failure" ]; then
            echo "::error::Some builds failed!"
            exit 1
          fi
          echo "All builds succeeded!"
